services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruangku_db}
      MYSQL_USER: ${MYSQL_USER:-ruangku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the project .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ruangku}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the project .env}@mysql:3306/${MYSQL_DATABASE:-ruangku_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project .env}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-RuangKu <no-reply@example.com>}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:4173}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - room_uploads:/app/uploads
    restart: unless-stopped

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-4173}:3000"
    restart: unless-stopped

volumes:
  mysql_data:
  room_uploads:
